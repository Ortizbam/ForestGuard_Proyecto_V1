services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forestguard
      POSTGRES_USER: forestguard
      POSTGRES_PASSWORD: forestguard_local_only
    volumes:
      - forestguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forestguard -d forestguard"]
      interval: 5s
      timeout: 5s
      retries: 15
    ports:
      - "5433:5432"
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://forestguard:forestguard_local_only@db:5432/forestguard
      FORESTGUARD_API_KEY: ${FORESTGUARD_API_KEY:-CAMBIA_ESTA_CLAVE_LOCAL}
      OFFLINE_AFTER_MINUTES: ${OFFLINE_AFTER_MINUTES:-15}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  forestguard_pgdata: